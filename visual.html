<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MACHINE VB3 | Analyse</title>
<meta name="description" content="Visualisation des logs et analyses MACHINE VB3.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
    :root{
        --primary:#5865F2;
        --secondary:#00d4ff;
        --bg:#050507;
        --card:rgba(255,255,255,0.04);
        --card-hover:rgba(255,255,255,0.07);
        --border:rgba(255,255,255,0.07);
        --border-hover:rgba(88,101,242,0.5);
        --text:#ffffff;
        --text-dim:#8b95a5;
        --text-muted:#5a6372;
        --radius:16px;
        --radius-lg:24px;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Inter',system-ui,-apple-system,sans-serif;
    }

    body{
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:40px 20px;
        background-image:
        radial-gradient(circle at 20% 15%,rgba(88,101,242,0.12),transparent 45%),
        radial-gradient(circle at 85% 75%,rgba(0,212,255,0.08),transparent 45%);
    }

    .cls{
        max-width:640px;
        width:100%;
        background:var(--card);
        border:1px solid var(--border);
        border-radius:var(--radius-lg);
        backdrop-filter:blur(20px);
        padding:48px;
        text-align:center;
        box-shadow:0 20px 60px rgba(0,0,0,0.4);
        animation:fadeIn 0.6s cubic-bezier(0.16,1,0.3,1);
        position:relative;
    }

    @keyframes fadeIn{
        from{opacity:0;transform:translateY(20px);}
        to{opacity:1;transform:translateY(0);}
    }

    .back-link{
        display:inline-flex;
        align-items:center;
        gap:6px;
        font-size:14px;
        font-weight:500;
        text-decoration:none;
        color:var(--text-dim);
        transition:color 0.2s;
        position:absolute;
        top:24px;
        left:24px;
    }

    .back-link i{width:16px;height:16px;}
    .back-link:hover{color:var(--secondary);}

    .status-badge{
        position:absolute;
        top:24px;
        right:24px;
        display:flex;
        align-items:center;
        gap:8px;
        font-size:12px;
        font-weight:600;
        padding:5px 12px;
        border-radius:20px;
    }

    .status-badge.offline{
        color:#ff5c5c;
        background:rgba(255,59,59,0.1);
        border:1px solid rgba(255,59,59,0.15);
    }

    .status-badge.online{
        color:#34d399;
        background:rgba(52,211,153,0.1);
        border:1px solid rgba(52,211,153,0.15);
    }

    .status-dot{
        width:7px;
        height:7px;
        border-radius:50%;
        background:currentColor;
    }

    .status-badge.online .status-dot{
        animation:pulse-dot 2s infinite;
    }

    @keyframes pulse-dot{
        0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,0.4);}
        50%{opacity:0.8;box-shadow:0 0 0 6px rgba(52,211,153,0);}
    }

    .logo-icon{
        width:56px;
        height:56px;
        background:linear-gradient(135deg,var(--primary),var(--secondary));
        border-radius:16px;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        margin:24px auto 18px;
        box-shadow:0 8px 30px rgba(88,101,242,0.3);
    }

    .logo-icon i{width:28px;height:28px;color:white;}

    h1{
        font-size:28px;
        font-weight:800;
        letter-spacing:-0.5px;
        background:linear-gradient(135deg,var(--primary),var(--secondary));
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
        margin-bottom:8px;
    }

    .title{
        color:var(--text-dim);
        font-size:14px;
        margin-bottom:28px;
    }

    /* Feature card */
    .feature{
        background:var(--card);
        padding:24px;
        border-radius:var(--radius);
        border:1px solid var(--border);
        transition:all 0.25s;
        text-align:left;
        margin-bottom:24px;
    }

    .feature:hover{
        border-color:var(--border-hover);
        background:var(--card-hover);
    }

    .feature-icon{
        width:40px;
        height:40px;
        border-radius:10px;
        display:flex;
        align-items:center;
        justify-content:center;
        margin-bottom:14px;
        background:rgba(88,101,242,0.12);
        color:var(--primary);
    }

    .feature-icon i{width:20px;height:20px;}

    .feature h3{
        font-size:15px;
        font-weight:600;
        margin-bottom:6px;
    }

    .feature p{
        font-size:13px;
        color:var(--text-dim);
        line-height:1.5;
    }

    /* Console */
    .console-header{
        display:flex;
        align-items:center;
        gap:8px;
        margin:24px 0 10px;
        color:var(--text-dim);
        font-size:13px;
        font-weight:600;
    }

    .console-header i{width:16px;height:16px;color:var(--secondary);}

    .console{
        background:rgba(0,0,0,0.6);
        border-radius:12px;
        padding:16px;
        text-align:left;
        height:220px;
        overflow-y:auto;
        font-size:13px;
        border:1px solid var(--border);
    }

    .console::-webkit-scrollbar{width:4px;}
    .console::-webkit-scrollbar-track{background:transparent;}
    .console::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}

    .log{
        color:rgba(0,212,255,0.8);
        margin-bottom:4px;
        font-family:'JetBrains Mono',monospace;
        font-size:12px;
    }

    .footer{
        margin-top:28px;
        font-size:12px;
        color:var(--text-muted);
    }

    @media(max-width:640px){
        .cls{padding:28px 20px;}
        h1{font-size:24px;}
    }
</style>
</head>

<body>

<div class="cls">

<a href="/admin" class="back-link">
    <i data-lucide="arrow-left"></i>
    Retour
</a>

<div class="status-badge offline" id="botStatus">
    <span class="status-dot"></span>
    Hors ligne
</div>

<div class="logo-icon">
    <i data-lucide="bar-chart-3"></i>
</div>

<h1>MACHINE VB3<br>ANALYSE</h1>

<p class="title">
    Consultez en live les logs d'utilisation du bot de chaque utilisateur.
</p>

<div class="feature">
    <div class="feature-icon"><i data-lucide="activity"></i></div>
    <h3>Monitoring en temps réel</h3>
    <p>Gestion des logs et messages que le bot traite en direct.</p>
</div>

<div class="console-header">
    <i data-lucide="terminal"></i>
    Logs d'utilisation du bot
</div>
<div class="console" id="console"></div>

<div class="footer">
    MACHINE VB3 · Analyse Interface
</div>

</div>

<script>
lucide.createIcons();

async function checkBot() {
    try{
        const res = await fetch("/status")
        const data = await res.json()
        const badge = document.getElementById("botStatus")

        if(data.connected){
            badge.className="status-badge online"
            badge.innerHTML='<span class="status-dot"></span>Connecté'
        }else{
            badge.className="status-badge offline"
            badge.innerHTML='<span class="status-dot"></span>Hors ligne'
        }
    }catch(e){}
}
setInterval(checkBot,1000)

async function Logs(){
    try{
        const res = await fetch("/log")
        const logs = await res.json()
        const box = document.getElementById("console")
        box.innerHTML=""

        logs.forEach(l=>{
            const line = document.createElement("div")
            line.className = "log"
            line.innerText = "["+l.time+"] "+l.msg
            box.appendChild(line)
        })

        box.scrollTop = box.scrollHeight
    }catch(e){}
}
setInterval(Logs,2000)
</script>
</body>
</html>
