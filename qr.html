<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MACHINE VB3 | QR Connecte</title>
<meta name="description" content="Scannez un QR Code pour connecter votre WhatsApp.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
    :root{
        --primary:#5865F2;
        --secondary:#00d4ff;
        --bg:#050507;
        --card:rgba(255,255,255,0.04);
        --border:rgba(255,255,255,0.07);
        --text:#ffffff;
        --text-dim:#8b95a5;
        --text-muted:#5a6372;
        --radius-lg:24px;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Inter',system-ui,-apple-system,sans-serif;
    }

    body{
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:40px 20px;
        background-image:
        radial-gradient(circle at 20% 15%,rgba(88,101,242,0.12),transparent 45%),
        radial-gradient(circle at 85% 75%,rgba(0,212,255,0.08),transparent 45%);
    }

    .container{
        max-width:600px;
        width:100%;
        background:var(--card);
        border:1px solid var(--border);
        border-radius:var(--radius-lg);
        backdrop-filter:blur(20px);
        padding:48px;
        text-align:center;
        box-shadow:0 20px 60px rgba(0,0,0,0.4);
        animation:fadeIn 0.6s cubic-bezier(0.16,1,0.3,1);
        position:relative;
    }

    @keyframes fadeIn{
        from{opacity:0;transform:translateY(20px);}
        to{opacity:1;transform:translateY(0);}
    }

    .back-link{
        display:inline-flex;
        align-items:center;
        gap:6px;
        font-size:14px;
        font-weight:500;
        text-decoration:none;
        color:var(--text-dim);
        transition:color 0.2s;
        position:absolute;
        top:24px;
        left:24px;
    }

    .back-link i{width:16px;height:16px;}
    .back-link:hover{color:var(--secondary);}

    .logo-icon{
        width:56px;
        height:56px;
        background:linear-gradient(135deg,var(--primary),var(--secondary));
        border-radius:16px;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        margin-bottom:18px;
        box-shadow:0 8px 30px rgba(88,101,242,0.3);
    }

    .logo-icon i{width:28px;height:28px;color:white;}

    h1{
        font-size:32px;
        font-weight:800;
        letter-spacing:-0.5px;
        background:linear-gradient(135deg,var(--primary),var(--secondary));
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
        margin-bottom:8px;
    }

    .subtitle{
        color:var(--text-dim);
        font-size:15px;
        margin-bottom:28px;
    }

    #qrBox{
        margin-top:16px;
        display:flex;
        justify-content:center;
    }

    canvas{
        background:white;
        padding:12px;
        border-radius:14px;
        box-shadow:0 4px 20px rgba(0,0,0,0.3);
    }

    .console-header{
        display:flex;
        align-items:center;
        gap:8px;
        margin:32px 0 10px;
        color:var(--text-dim);
        font-size:13px;
        font-weight:600;
    }

    .console-header i{width:16px;height:16px;color:var(--secondary);}

    .console{
        background:rgba(0,0,0,0.6);
        border-radius:12px;
        padding:16px;
        text-align:left;
        height:180px;
        overflow-y:auto;
        font-size:13px;
        border:1px solid var(--border);
    }

    .console::-webkit-scrollbar{width:4px;}
    .console::-webkit-scrollbar-track{background:transparent;}
    .console::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}

    .log{
        color:rgba(0,212,255,0.8);
        margin-bottom:4px;
        font-family:'JetBrains Mono',monospace;
        font-size:12px;
    }

    @media(max-width:640px){
        .container{padding:28px 20px;}
        h1{font-size:26px;}
    }
</style>
</head>

<body>

<div class="container">

<a href="/" class="back-link">
    <i data-lucide="arrow-left"></i>
    Retour
</a>

<div class="logo-icon">
    <i data-lucide="scan"></i>
</div>

<h1>QR WhatsApp</h1>
<p class="subtitle">Scannez ce QR Code avec WhatsApp</p>

<div id="qrBox"></div>

<div class="console-header">
    <i data-lucide="terminal"></i>
    Console
</div>
<div class="console" id="console"></div>

</div>

<script>
lucide.createIcons();

function log(msg) {
    const consoleBox = document.getElementById("console");
    const div = document.createElement("div");
    div.className = "log";
    div.innerText = msg;
    consoleBox.appendChild(div);
    consoleBox.scrollTop = consoleBox.scrollHeight;
}

async function loadQR() {
    try{
        const res = await fetch("/qr-verif");
        const data = await res.json();

        if (!data.qr) return;

        document.getElementById("qrBox").innerHTML = "";

        QRCode.toCanvas(data.qr, { width: 250 }, function (err, canvas) {
            document.getElementById("qrBox").appendChild(canvas);
        });

        log("[OK] QR Code chargé");
    }catch(e){}
}

setInterval(loadQR, 8000);
loadQR();
</script>
</body>
</html>
